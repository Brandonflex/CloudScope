# CloudScope — Azure Deployment Pipeline
# Deploys to Azure on push to main (after CI passes)

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: 'cloudscope-rg'
  AZURE_LOCATION: 'eastus'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  # ─── Deploy Infrastructure ───────────────────────────────
  deploy-infra:
    name: Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: az group create --name ${{ env.AZURE_RESOURCE_GROUP }} --location ${{ env.AZURE_LOCATION }}

      - name: Deploy Bicep Template
        run: |
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters.prod.json \
            --parameters aadTenantId=${{ secrets.AZURE_AD_TENANT_ID }} \
            --parameters aadClientId=${{ secrets.AZURE_AD_CLIENT_ID }}

  # ─── Build & Deploy Backend ──────────────────────────────
  deploy-backend:
    name: Deploy .NET API
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore + Build + Publish
        run: |
          dotnet restore src/server/CloudScope.Api/CloudScope.Api.csproj
          dotnet publish src/server/CloudScope.Api/CloudScope.Api.csproj \
            --configuration Release \
            --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to App Service
        run: |
          az webapp deployment source config-zip \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.APP_SERVICE_NAME }} \
            --src ./publish.zip

  # ─── Build & Deploy Frontend ─────────────────────────────
  deploy-frontend:
    name: Deploy Angular App
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Install and Build
        working-directory: src/client
        run: |
          npm ci
          npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: 'src/client'
          output_location: 'dist/cloudscope/browser'