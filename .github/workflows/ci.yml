# CloudScope — CI Pipeline
# Runs on every PR and push to main
# Builds backend + frontend, runs tests, lints code

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  # ─── Backend Build & Test ────────────────────────────────
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/server/CloudScope.sln

      - name: Build
        run: dotnet build src/server/CloudScope.sln --no-restore --configuration Release

      - name: Run tests
        run: |
          set +e
          dotnet test src/server/CloudScope.sln --no-build --configuration Release --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" --results-directory TestResults \
            --collect:"XPlat Code Coverage"
          status=$?
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate-test-failures.py
          fi
          exit $status

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ─── Frontend Build & Test ───────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      - name: Lint
        run: npx ng lint --force || true  # Non-blocking until eslint is configured
        working-directory: src/client

      - name: Build
        run: npx ng build --configuration development
        working-directory: src/client

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless || true  # Non-blocking until tests are written
        working-directory: src/client

  # ─── Security Scanning ──────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: csharp, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ─── Bicep Validation ────────────────────────────────────
  infra:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        continue-on-error: true

      - name: Validate Bicep templates
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null 2>&1 || echo "Bicep validation requires Azure CLI login"
        continue-on-error: true