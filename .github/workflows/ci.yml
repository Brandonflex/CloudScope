# CloudScope — CI Pipeline
# Runs on every PR and push to main
# Builds backend + frontend, runs tests, lints code

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20'

jobs:
  # ─── Backend Build & Test ────────────────────────────────
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/server/CloudScope.sln

      - name: Build
        run: dotnet build src/server/CloudScope.sln --no-restore --configuration Release

      - name: Smoke test gateway and API integration
        run: bash .github/scripts/smoke-gateway.sh

      - name: Run tests
        run: |
          set +e
          dotnet test src/server/CloudScope.sln --no-build --configuration Release --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" --results-directory TestResults \
            --collect:"XPlat Code Coverage"
          status=$?
          if [ $status -ne 0 ]; then
            python3 .github/scripts/annotate-test-failures.py
          fi
          exit $status

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ─── Frontend Build & Test ───────────────────────────────
  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/client

      - name: Lint
        run: npx ng lint
        working-directory: src/client

      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"
        working-directory: src/client

      - name: Build
        run: npx ng build --configuration production
        working-directory: src/client

      - name: Test demo API integration
        run: node --test mock-api/tests/*.test.mjs
        working-directory: src/client

      - name: Run unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
        working-directory: src/client

  # ─── Bicep Validation ────────────────────────────────────
  infra:
    name: Infrastructure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bicep
        run: az bicep install

      - name: Validate Bicep templates
        run: az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
  gateway:
    name: Gateway security and container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/gateway/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src/gateway
      - name: Test gateway and signed OIDC flows
        run: npm test
        working-directory: src/gateway
      - name: Audit production dependencies
        run: npm audit --omit=dev
        working-directory: src/gateway
      - name: Build experimental container
        run: |
          docker build -f src/gateway/Dockerfile -t cloudscope-gateway-test .
          docker run --rm --entrypoint node cloudscope-gateway-test --version
          if docker run --rm cloudscope-gateway-test; then
            echo "Gateway must fail closed without explicit live configuration" >&2
            exit 1
          fi
