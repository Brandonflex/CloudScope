version: 2
updates:
  # ── Frontend (Angular, Chart.js, Cytoscape, SignalR) ──────────────
  - package-ecosystem: npm
    directory: /src/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
      linting:
        patterns:
          - 'eslint*'
          - 'typescript-eslint'
          - 'prettier'
    labels:
      - dependencies
      - frontend

  # ── Backend (NuGet) ───────────────────────────────────────────────
  - package-ecosystem: nuget
    directory: /src/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      aspnetcore:
        patterns:
          - 'Microsoft.*'
          - 'Serilog*'
          - 'Swashbuckle*'
    labels:
      - dependencies
      - backend

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

  # ── Containers ────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /src/server
    schedule:
      interval: monthly
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /src/client
    schedule:
      interval: monthly
    labels:
      - dependencies
      - containers
