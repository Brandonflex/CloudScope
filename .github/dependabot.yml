version: 2
updates:
  # ── Frontend (Angular, Chart.js, Cytoscape, SignalR) ──────────────
  - package-ecosystem: npm
    directory: /src/client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      angular:
        update-types: ['minor', 'patch']
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
      linting:
        update-types: ['minor', 'patch']
        patterns:
          - 'eslint*'
          - 'typescript-eslint'
          - 'prettier'
    labels:
      - dependencies
      - frontend

  # ── Backend (NuGet) ───────────────────────────────────────────────
  - package-ecosystem: nuget
    directory: /src/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      aspnetcore:
        update-types: ['minor', 'patch']
        patterns:
          - 'Microsoft.*'
          - 'Serilog*'
          - 'Swashbuckle*'
    labels:
      - dependencies
      - backend

  # ── GitHub Actions ────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci

  # ── Containers ────────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /src/server
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # The API targets net8.0; runtime/SDK majors are upgraded deliberately.
      - dependency-name: 'mcr.microsoft.com/dotnet/aspnet'
        update-types: ['version-update:semver-major']
      - dependency-name: 'mcr.microsoft.com/dotnet/sdk'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
      - containers

  - package-ecosystem: docker
    directory: /src/client
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # Angular 20 supports Node 20/22/24; new Node majors are adopted manually.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
      - containers
