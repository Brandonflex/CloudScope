version: "3.9"

services:
  # Azure Cosmos DB Emulator (local development)
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: cloudscope-cosmos
    ports:
      - "8081:8081"  # Data Explorer
      - "10251:10251" # Gremlin API
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos-data:/data/db
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cloudscope-net

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cloudscope-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cloudscope-net

  # Azure SQL Edge (lightweight SQL for local dev)
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: cloudscope-sql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=CloudScope!Dev2026
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "CloudScope!Dev2026" -Q "SELECT 1" -C -No
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cloudscope-net

  # ─── Application (optional: docker compose --profile app up) ───
  api:
    build:
      context: ./src/server
    container_name: cloudscope-api
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Platform__StorageProvider=InMemory
      - Platform__SeedDemoData=true
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - cloudscope-net

  web:
    build:
      context: ./src/client
    container_name: cloudscope-web
    profiles: ["app"]
    ports:
      - "8089:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cloudscope-net

volumes:
  cosmos-data:
  redis-data:
  sql-data:

networks:
  cloudscope-net:
    driver: bridge